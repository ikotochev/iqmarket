<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141C16">
<title>Няма връзка — IQ Market</title>
<style>
  :root{--bg:#0D130F;--surface:#141C16;--ink:#EAF3EC;--ink-soft:#A3B4A8;--brand:#34C267;--line:#26322B}
  @media(prefers-color-scheme:light){:root{--bg:#F5F7F1;--surface:#FFFFFF;--ink:#152418;--ink-soft:#4C5B51;--brand:#128A3E;--line:#DCE4D6}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:380px;width:100%}
  svg{width:72px;height:72px;display:block;margin:0 auto}
  h1{font-size:1.25rem;margin:16px 0 8px}
  p{color:var(--ink-soft);margin:0 0 20px;line-height:1.5}
  button{border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;background:var(--brand);color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="72" height="72" role="img" aria-label="IQ Market">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA84F"/><stop offset="1" stop-color="#0B6B2E"/></linearGradient></defs>
<rect width="512" height="512" rx="112" fill="url(#g)"/>
<g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(160 62) scale(8)"><path d="M4 5h2l1.5 10.5a1.5 1.5 0 0 0 1.5 1.3h7.6a1.5 1.5 0 0 0 1.5-1.2L21 8H7"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
<path d="M95 305V415" stroke="#FFFFFF"/>
<ellipse cx="200" cy="360" rx="44" ry="60" stroke="#FFFFFF"/>
<path d="M214 388L262 436" stroke="#F2A33A"/>
<path d="M305 415V305L358 385L411 305V415" stroke="#FFFFFF"/></g>
</svg>
    <h1>Няма връзка с интернет</h1>
    <p>Провери мобилните данни или Wi-Fi и опитай отново. Кошницата ти е запазена.</p>
    <button onclick="location.reload()">Опитай отново</button>
  </div>
</body>
</html>
