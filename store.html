<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141C16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQ Market">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>/* хваща предложението за инсталиране рано — Chrome може да го прати преди края на страницата */
window.__iqmInstall=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__iqmInstall=e;if(window.__iqmOnInstall)window.__iqmOnInstall(e);});</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазин — IQ Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{
    --bg:#F5F7F1;--surface:#FFFFFF;--surface-2:#EEF3EA;--ink:#152418;--ink-soft:#4C5B51;--ink-faint:#7A897F;
    --brand:#128A3E;--brand-deep:#0B6B2E;--line:#DCE4D6;--danger:#C0392B;--maxw:1760px;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D130F;--surface:#141C16;--surface-2:#1B241D;--ink:#EAF3EC;--ink-soft:#A3B4A8;--ink-faint:#7E9084;
    --brand:#34C267;--brand-deep:#27A557;--line:#26322B;}}
  :root[data-theme="dark"]{
    --bg:#0D130F;--surface:#141C16;--surface-2:#1B241D;--ink:#EAF3EC;--ink-soft:#A3B4A8;--ink-faint:#7E9084;
    --brand:#34C267;--brand-deep:#27A557;--line:#26322B;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;color:var(--ink)}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--brand),var(--brand-deep));display:grid;place-items:center}
  .mark svg{width:19px;height:19px}
  .spacer{flex:1}
  .hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:600}
  .hbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .cart-btn{position:relative}
  .deliverbar{padding:7px 14px;font-size:.86rem;background:var(--surface-2);border-top:1px solid var(--line);color:var(--ink-soft);text-align:center}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:20px;font-size:.7rem;
    min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
  /* layout */
  main{max-width:var(--maxw);margin:0 auto;padding:16px 14px}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1rem;margin-bottom:14px}
  /* layout: категории отстрани + съдържание */
  .layout{display:grid;grid-template-columns:214px 1fr;gap:20px;align-items:start}
  /* без това редът с категориите разтяга колоната (и цялата страница) до ~2400px на телефон */
  .layout>*{min-width:0}
  .side{position:sticky;top:80px}
  .side-title{font-size:.75rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px 6px}
  .catlist{display:flex;flex-direction:column;gap:2px}
  .catlink{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;color:var(--ink-soft);
    font-weight:600;font-size:.9rem;border:1px solid transparent;text-align:left;background:transparent;width:100%}
  .catlink .cnt{margin-left:auto;font-size:.74rem;color:var(--ink-faint)}
  .catlink:hover{background:var(--surface)}
  .catlink.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .catlink.active .cnt{color:#e6ffee}
  .brandbanner{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line,#ddd)}
  .brandbanner .bi{font-size:2.3rem}
  .brandbanner .bn{font-size:1.25rem;font-weight:800;color:var(--ink)}
  .brandbanner .bt{font-size:.82rem;color:var(--ink-faint)}
  @media(max-width:760px){
    .layout{grid-template-columns:1fr;gap:8px}
    .side{position:static}
    .side-title{display:none}
    .catlist{flex-direction:row;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
    .catlink{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:7px 13px}
    .catlink .cnt{display:none}
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  @media(max-width:760px){
    .grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .card .img{aspect-ratio:4/3}
    .card .body{padding:7px 8px 9px;gap:4px}
    .card .name{font-size:.78rem;min-height:2.4em;line-height:1.2}
    .card .brand-s{font-size:.68rem}
    .price{font-size:.9rem}
    .add{font-size:.76rem;padding:7px}
    .stepper button{width:28px;height:30px;font-size:1.05rem}
    .stepper .q{font-size:.8rem}
    .fav{width:26px;height:26px;font-size:.9rem}
  }
  @media(max-width:420px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  .card .img,.card .name{cursor:pointer}
  /* детайл на продукт */
  .det-img{width:100%;aspect-ratio:16/10;background:var(--surface-2);border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:3rem}
  .det-img img{width:100%;height:100%;object-fit:contain}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card .img{position:relative;aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
  .fav{position:absolute;top:6px;right:6px;border:none;background:rgba(255,255,255,.92);color:#C0392B;width:30px;height:30px;border-radius:50%;font-size:1.05rem;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1}
  .fav.on{background:#C0392B;color:#fff}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .card .img .ph{font-size:2.4rem;opacity:.5}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .name{font-size:.92rem;font-weight:600;line-height:1.25;min-height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .brand-s{font-size:.75rem;color:var(--ink-faint)}
  .price{font-weight:800;color:var(--brand);font-size:1.05rem}
  .price .old{font-weight:500;color:var(--ink-faint);text-decoration:line-through;font-size:.8rem;margin-left:5px}
  .addrow{margin-top:auto;display:flex;align-items:center;gap:8px}
  .add{flex:1;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:.88rem}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--brand);border-radius:10px;overflow:hidden;flex:1}
  .stepper button{background:var(--surface);color:var(--brand);border:none;width:34px;height:36px;font-size:1.2rem;font-weight:700}
  .stepper .q{flex:1;text-align:center;font-weight:700;font-size:.9rem}
  .muted{color:var(--ink-faint)}
  .center{text-align:center;padding:50px 20px;color:var(--ink-faint)}
  /* drawer + modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  .overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg);z-index:50;
    transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer header{position:static}
  .dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
  .dhead h2{margin:0;font-size:1.15rem}
  .x{margin-left:auto;border:none;background:transparent;font-size:1.5rem;color:var(--ink-soft);line-height:1}
  .ditems{flex:1;overflow-y:auto;padding:12px 16px}
  .citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .citem .ci-img{width:52px;height:52px;border-radius:10px;background:var(--surface-2);object-fit:cover;flex-shrink:0}
  .citem .ci-name{font-size:.86rem;font-weight:600;line-height:1.2}
  .citem .ci-price{font-size:.8rem;color:var(--ink-faint)}
  .dfoot{border-top:1px solid var(--line);padding:16px 18px;background:var(--surface)}
  .rowb{display:flex;justify-content:space-between;align-items:center;margin:5px 0}
  .big{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:800;width:100%;margin-top:10px}
  .big:disabled{opacity:.5}
  /* modal (auth/checkout) */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
  .modal.open{display:flex}
  .sheet{background:var(--bg);border-radius:16px;width:min(440px,100%);max-height:92vh;overflow-y:auto;padding:22px}
  .sheet h2{margin:0 0 4px}
  .tabs{display:flex;gap:6px;margin:14px 0}
  .tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;font-weight:700}
  .tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px;color:var(--ink-soft)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem;font-family:inherit}
  .err{color:var(--danger);font-size:.85rem;margin-top:10px;min-height:1em}
  .ok-box{text-align:center;padding:16px}
  .ok-box .big-check{font-size:3rem}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:12px 18px;border-radius:12px;z-index:80;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:.96}
  .info{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--ink-soft);margin:10px 0}
  .det-img{cursor:zoom-in}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .paysel{display:flex;gap:8px;margin-top:6px}
  .payopt{flex:1;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;font-weight:700;font-size:.9rem}
  .payopt.active{border-color:var(--brand);color:var(--brand);background:var(--surface-2)}
  .ordrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;color:var(--ink)}
  .stbadge{color:#fff;border-radius:20px;padding:5px 12px;font-size:.78rem;font-weight:700;white-space:nowrap}
  /* инсталиране като приложение (PWA) */
  .installbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--brand);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .installbar[hidden]{display:none}
  .installbar img{width:40px;height:40px;border-radius:10px;flex:none}
  .installbar .itxt{flex:1;min-width:0;font-size:.88rem;color:var(--ink-soft);line-height:1.4}
  .installbar .itxt strong{color:var(--ink);display:block;font-size:.95rem}
  .installbar .x{background:none;border:0;color:var(--ink-faint);font-size:1.4rem;line-height:1;padding:4px 6px;min-width:40px;min-height:40px}
  /* телефон: по-компактна горна лента и лента за инсталиране */
  .brand{white-space:nowrap}
  @media(max-width:520px){
    .bar{gap:8px;padding:10px 12px}
    .hbtn{padding:8px 10px}
    .installbar{padding:8px 6px 8px 10px;gap:8px}
    .installbar img{width:34px;height:34px;border-radius:8px}
    .installbar .itxt{font-size:.82rem}
    .installbar.has-btn .itxt span{display:none}
  }
  @media(max-width:420px){
    .brand .btxt{display:none}
  }
  /* телефон: размерите на картите стоят ТУК (в края), защото основните правила за .card са след
     по-ранния @media блок и го презаписваха — мобилните размери не се прилагаха изобщо */
  @media(max-width:760px){
    .side{position:sticky;top:var(--hdr,58px);z-index:15;background:var(--bg);margin:0 -14px;padding:6px 14px 0}
    .card .img{aspect-ratio:4/3}
    .card .body{padding:8px 9px 10px;gap:4px}
    .card .name{font-size:.8rem;min-height:2.4em;line-height:1.2}
    .card .brand-s{font-size:.68rem}
    .price{font-size:.92rem}
    .add{font-size:.8rem;padding:8px}
    .stepper button{width:30px;height:34px;font-size:1.05rem}
    .stepper .q{font-size:.82rem}
    .fav{width:28px;height:28px;font-size:.9rem}
    .toast{bottom:auto;top:calc(var(--hdr,58px) + 10px)}
  }
  @media(max-width:420px){
    .card .name{font-size:.86rem}
    .price{font-size:1rem}
    .add{font-size:.86rem;padding:9px}
  }
  /* търсене + подреждане по цена (като приложението) */
  .searchrow{display:flex;gap:8px;margin-bottom:14px}
  .searchrow .search{margin-bottom:0;flex:1;min-width:0}
  .sortsel{flex:none;width:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:.9rem;padding:0 10px;font-family:inherit}
  /* Моите адреси */
  .addr{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .addr .ai{font-size:1.3rem;line-height:1.2}
  .addr .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .addr .acts button{font-size:.8rem;padding:6px 10px}
  .tag{display:inline-block;background:var(--brand);color:#fff;border-radius:20px;font-size:.7rem;padding:2px 8px;margin-left:6px;vertical-align:middle;font-weight:700}
  /* основен цвят */
  .accents{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .accents button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
  .accents button.active{border-color:var(--ink)}
  /* как да използвам */
  .howstep{display:flex;gap:12px;margin:12px 0}
  .howstep .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
  /* име в профила: малък бутон „Редактирай“ вътре в полето */
  .namefield{position:relative}
  .namefield input{padding-right:132px}
  .namefield input[readonly]{background:var(--surface-2);cursor:default}
  .namefield .hbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:.8rem}
  /* категории: един бутон „Категории“ и списък надолу — на телефон и на компютър */
  .layout{grid-template-columns:1fr;gap:8px}
  .side-title{display:none}
  .side{position:sticky;top:var(--hdr,58px);z-index:15;background:var(--bg);margin:0 -14px;padding:6px 14px 0}
  .catbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:12px;padding:11px 14px;font-weight:700;font-size:.95rem;margin-bottom:8px;text-align:left}
  .catbtn .cl{flex:none}
  .catbtn .cur{flex:1;min-width:0;text-align:right;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .catbtn .car{flex:none;transition:transform .15s;color:var(--ink-soft)}
  .side.open .catbtn{border-color:var(--brand)}
  .side.open .catbtn .car{transform:rotate(180deg)}
  .catlist{display:none}
  .side.open .catlist{display:flex;flex-direction:column;gap:2px;position:absolute;left:14px;right:14px;top:calc(100% - 4px);
    max-height:min(65vh,520px);overflow-y:auto;padding:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:16}
  .side.open .catlink{white-space:normal;border:none;border-radius:10px;padding:11px 12px;font-size:.95rem}
  .side.open .catlink .cnt{display:inline}
  .catback{display:none}
  .catback:not([hidden]){display:block;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35)}
  /* лентата с търсачка и категории: залепена горе; скрива се при превъртане надолу, показва се при превъртане нагоре */
  .toolbar{position:sticky;top:var(--hdr,58px);z-index:15;background:var(--bg);margin:0 -14px;padding:8px 14px 0;transition:transform .22s ease}
  .toolbar.hide{transform:translateY(calc(-100% - 12px))}
  .toolbar .searchrow{margin-bottom:8px}
  .toolbar .side{position:relative;top:auto;z-index:auto;margin:0;padding:0;background:none}
  .toolbar .side.open .catlist{left:0;right:0}
  /* бутон „към началото“ */
  .totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:48px;height:48px;border-radius:50%;
    border:none;background:var(--brand);color:#fff;font-size:1.5rem;font-weight:800;line-height:1;display:grid;place-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:.95}
  .totop[hidden]{display:none}
  @media(min-width:761px){   /* широк екран: категориите в няколко колони */
    .side.open .catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));max-height:70vh}
  }
</style>
</head>
<body>


<script>try{var _t=localStorage.getItem('iqm_theme');document.documentElement.setAttribute('data-theme',_t==='light'||_t==='system'?_t:'dark');
var _a=localStorage.getItem('iqm_accent');if(_a){document.documentElement.style.setProperty('--brand',_a);document.documentElement.style.setProperty('--brand-deep',_a);}}catch(e){}</script>
<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <span class="mark"><img src="logo-iqm.svg" alt="" style="width:100%;height:100%;border-radius:inherit;display:block"></span>
      <span class="btxt">IQ Market</span>
    </a>
    <span class="spacer"></span>
    <button class="hbtn cart-btn" id="newsBtn" title="Известия и анкети">🔔<span class="badge" id="newsBadge" hidden>0</span></button>
    <button class="hbtn" id="accountBtn">Вход</button>
    <button class="hbtn cart-btn" id="cartBtn" aria-label="Кошница">🛒 <span class="lbl">Кошница</span>
      <span class="badge" id="cartBadge" hidden>0</span>
    </button>
  </div>
  <div id="deliverbar" class="deliverbar" hidden></div>
</header>

<main>
  <div id="installBar" class="installbar" hidden>
    <img src="pwa-192.png" alt="">
    <div class="itxt"><strong>Инсталирай IQ Market</strong><span id="installText">Отваряй магазина с едно докосване от началния екран.</span></div>
    <button class="hbtn primary" id="installBtn" hidden>Инсталирай</button>
    <button class="x" id="installClose" title="Скрий" aria-label="Скрий">×</button>
  </div>
  <div id="announce"></div>
  <div class="toolbar" id="toolbar">
    <div class="searchrow">
      <input class="search" id="search" placeholder="Търсене на продукт..." type="search">
      <select class="sortsel" id="sort" aria-label="Подреди">
        <option value="">Подреди</option>
        <option value="asc">Цена ↑</option>
        <option value="desc">Цена ↓</option>
      </select>
    </div>
    <aside class="side">

// ---------- работно време и желан час (като lib/utils/working_hours.dart в приложението) ----------
const DELIVERY_START_MIN=9*60;
const WD=['','Пон','Вт','Ср','Чет','Пет','Съб','Нед'];
const pad2=n=>String(n).padStart(2,'0');
const wdKey=d=>String(d.getDay()===0?7:d.getDay());           // 1=пон … 7=нед
const toMin=t=>{const[a,b]=t.split(':');return (+a)*60+(+b);};
function isOpenAt(h,t){
  if(!h||!Object.keys(h).length)return true;                   // без работно време = винаги отворен
  const d=h[wdKey(t)]; if(!d||!d.open||!d.close)return false;
  const cur=t.getHours()*60+t.getMinutes(); return cur>=toMin(d.open)&&cur<toMin(d.close);
}
function nextOpening(h,from){
  if(isOpenAt(h,from))return from;
  for(let i=0;i<=7;i++){
    const day=new Date(from.getFullYear(),from.getMonth(),from.getDate()+i);
    const d=h[wdKey(day)]; if(!d||!d.open)continue;
    const m=toMin(d.open); const at=new Date(day.getFullYear(),day.getMonth(),day.getDate(),Math.floor(m/60),m%60);
    if(at>=from)return at;
  }
  return null;                                                   // склад без нито един работен ден
}
function earliestDelivery(hoursList,now){
  let e=now;
  for(const h of hoursList){const o=nextOpening(h,now); if(!o)return null; if(o>e)e=o;}
  const start=new Date(e.getFullYear(),e.getMonth(),e.getDate(),Math.floor(DELIVERY_START_MIN/60),DELIVERY_START_MIN%60);
  return e<start?start:e;
}
function dayLabel(d){
  const n=new Date(); const diff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
  if(diff===0)return 'днес'; if(diff===1)return 'утре';
  return `${WD[d.getDay()===0?7:d.getDay()]} ${pad2(d.getDate())}.${pad2(d.getMonth()+1)}`;
}
const dtLabel=d=>`${dayLabel(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const encodeDT=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function formatDT(raw){                                         // „2026-09-14 10:30" → „утре 10:30"; старите „18:00" както са
  if(!raw)return null; const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(raw); if(!m)return raw;
  return dtLabel(new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));
}

// ---------- кошницата в профила (cart_items) — като приложението: една и съща кошница на телефона и в сайта ----------
// При вход: продуктите от профила се добавят към тези в браузъра (по-новото количество в браузъра печели),
// после всяка промяна се записва с ЕДНА заявка след 0,4 сек. затишие.
let CART_UID=null, SYNCED={}, cartSyncT=null;
async function mergeServerCart(){
  if(!USER||!PRODUCTS.length||CART_UID===USER.id)return;
  const uid=USER.id; CART_UID=uid; SYNCED={};
  try{
    const {data,error}=await sb.from('cart_items').select('product_id,qty').eq('user_id',uid);
    if(error)throw error;
    const byId=new Map(all_ids()), drop=[];
    for(const r of (data||[])){
      const p=byId.get(r.product_id);
      if(!p||discounted(p)<=0||oos(p)){drop.push(r.product_id);continue;}   // скрит/без цена/изчерпан
      SYNCED[r.product_id]=+r.qty;
      if(!CART[r.product_id])CART[r.product_id]={product:p,qty:+r.qty};
    }
    if(drop.length)sb.from('cart_items').delete().eq('user_id',uid).in('product_id',drop).then(()=>{},()=>{});
  }catch(e){CART_UID=null;return;}
  saveCart(); renderGrid(); renderCart();
}
function scheduleCartSync(){
  if(!USER||CART_UID!==USER.id)return;
  clearTimeout(cartSyncT); cartSyncT=setTimeout(syncCartNow,400);
}
async function syncCartNow(){
  if(!USER||CART_UID!==USER.id)return;
  const uid=USER.id, ups=[], dels=[];
  for(const [id,it] of Object.entries(CART)) if(SYNCED[id]!==it.qty) ups.push({user_id:uid,product_id:id,qty:it.qty});
  for(const id of Object.keys(SYNCED)) if(!CART[id]) dels.push(id);
  try{
    if(ups.length){const {error}=await sb.from('cart_items').upsert(ups,{onConflict:'user_id,product_id'}); if(!error)ups.forEach(u=>SYNCED[u.product_id]=u.qty);}
    if(dels.length){const {error}=await sb.from('cart_items').delete().eq('user_id',uid).in('product_id',dels); if(!error)dels.forEach(id=>delete SYNCED[id]);}
  }catch(e){}   // тихо при мрежова грешка — следващата промяна изпраща пак разликата
}

const intl=p=>'+359'+clean(p).slice(1);
const smsFriendly=m=>/rate|seconds|too many/i.test(m)?'Твърде много опити. Изчакай минута и опитай пак.'
  :/expired|invalid/i.test(m)?'Грешен или изтекъл код. Провери SMS-а или поискай нов код.'
  :/sms|provider/i.test(m)?'Не успяхме да изпратим SMS. Опитай пак след малко или се обади на 0896 277 066.'
  :'Нещо се обърка. Опитай пак или се обади на 0896 277 066.';
async function regWithOtp(r){
  const err=$('authErr');
  const {error}=await sb.auth.signInWithOtp({phone:intl(r.phone)});
  if(error){err.textContent=smsFriendly(error.message||'');$('doReg').disabled=false;return;}
  $('authBody').innerHTML=`
    <p class="muted" style="font-size:.9rem;margin-top:12px">Изпратихме SMS с 6-цифрен код на <strong>${escapeHtml(r.phone)}</strong>. Въведи го, за да потвърдиш телефона.</p>

    <div class="err" id="authErr"></div>
    <button class="big" id="otpGo">Потвърди</button>
    <p style="text-align:center;font-size:.85rem;margin-top:8px"><a href="#" id="otpResend">Изпрати кода отново</a></p>`;
  $('otpCode').focus();
  $('otpResend').onclick=async e=>{e.preventDefault();const {error:e2}=await sb.auth.signInWithOtp({phone:intl(r.phone)});toast(e2?smsFriendly(e2.message||''):'Изпратихме нов код');};
  $('otpGo').onclick=async()=>{

    $('otpGo').disabled=true;
    try{
      const {data:v,error:ve}=await sb.auth.verifyOtp({phone:intl(r.phone),token:code,type:'sms'});
      if(ve||!v||!v.user){er.textContent=smsFriendly((ve&&ve.message)||'invalid');return;}
      const uid=v.user.id;
      // като completeRegistrationAfterOtp в приложението: имейл+парола към телефонния акаунт, после профил
      const {error:ue}=await sb.auth.updateUser({email:uid+'@dostavka.app',password:r.pass});
      if(ue){er.textContent='Не успяхме да запазим паролата: '+ue.message;return;}
      const {error:pe}=await sb.from('profiles').insert({id:uid,name:r.name,phone:r.phone,role:'client',address:r.addr+', '+r.zone,zone:r.zone,referral_code:genCode(),referred_by:r.ref||null,referral_discount:0});
      if(pe){er.textContent=/phone/.test(pe.message)?'Този телефон вече е регистриран':'Профилът не се създаде: '+pe.message;return;}
      await refreshUser(); closeModal(); toast('Акаунтът е създаден!');
    }catch(e){er.textContent='Грешка: '+e.message;}
    finally{const b=$('otpGo'); if(b)b.disabled=false;}
  };
}

// ---------- известия (push) чрез Firebase — като fcm_service.dart в приложението ----------
// Токенът се записва с register_fcm_token за влезлия клиент; send-fcm на сървъра праща до него
// (готова поръчка, доставчик на път, обяви от админа). На iPhone работи само от инсталираното приложение.
const FB_VER='10.12.2', PUSH_SCOPE='/firebase-cloud-messaging-push-scope';
let fbMsg=null;
function pushToken(){try{return localStorage.getItem('iqm_push_token')||'';}catch(e){return '';}}
function isIOS(){const ua=navigator.userAgent||'';return /iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function pushSupport(){
  if('Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window) return 'ok';
  return (isIOS() && !isStandalone()) ? 'ios-install' : 'no';
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('не се зареди '+src));document.head.appendChild(s);});}
async function fbMessaging(){
  if(fbMsg)return fbMsg;
  if(!window.IQM_FIREBASE) await loadScript('firebase-config.js');   // в страницата self === window
  if(!window.firebase||!firebase.messaging){
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-messaging-compat.js`);
  }
  if(!firebase.apps.length) firebase.initializeApp(window.IQM_FIREBASE);
  fbMsg=firebase.messaging();
  // докато сайтът е отворен, Firebase не показва известие → показваме го като съобщение в сайта
  fbMsg.onMessage(p=>{const n=(p&&p.notification)||{};toast((n.title?n.title+': ':'')+(n.body||''));if($('ordList'))renderOrders();});
  return fbMsg;
}
// нов service worker → изчакай да стане активен (иначе абонаментът пада с „no active Service Worker“)
function swActive(reg){
  if(reg.active) return Promise.resolve(reg);
  const sw=reg.installing||reg.waiting;
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new Error('service worker не се активира')),15000);
    if(!sw){clearTimeout(t);res(reg);return;}
    sw.addEventListener('statechange',()=>{if(sw.state==='activated'){clearTimeout(t);res(reg);}});
  });
}
async function getPushToken(){
  const m=await fbMessaging();
  const reg=await swActive(await navigator.serviceWorker.register('firebase-messaging-sw.js',{scope:PUSH_SCOPE}));
  return await m.getToken({serviceWorkerRegistration:reg});
}
async function enablePush(){            // само от натискане на бутон (iPhone го изисква)
  const sup=pushSupport();
  if(sup!=='ok'){renderPushBox();return;}
  let perm=Notification.permission;
  if(perm==='default') perm=await Notification.requestPermission();
  if(perm!=='granted'){toast(perm==='denied'?'Известията са блокирани в браузъра':'Известията не са разрешени');renderPushBox();return;}
  const b=$('pushOn'); if(b){b.disabled=true;b.textContent='Включване…';}
  try{
    const token=await getPushToken();
    if(!token) throw new Error('няма токен');
    const {error}=await sb.rpc('register_fcm_token',{p_token:token});
    if(error) throw error;
    try{localStorage.setItem('iqm_push_token',token);}catch(e){}
    toast('Известията са включени ✓');
  }catch(e){ console.warn('push',e); toast('Не успяхме да включим известията. Опитай пак след малко.'); }
  renderPushBox();
}
async function disablePush(){
  const t=pushToken();
  try{ if(t) await sb.rpc('unregister_fcm_token',{p_token:t}); }catch(e){}
  try{ const m=await fbMessaging(); await m.deleteToken(); }catch(e){}
  try{localStorage.removeItem('iqm_push_token');}catch(e){}
  toast('Известията са изключени'); renderPushBox();
}
// при вход: ако известията вече са включени в този браузър → тихо обнови токена (Firebase понякога го сменя)
async function refreshPushToken(){
  if(!USER||!pushToken()||pushSupport()!=='ok'||Notification.permission!=='granted')return;
  try{const tok=await getPushToken(); if(tok){await sb.rpc('register_fcm_token',{p_token:tok}); if(tok!==pushToken())localStorage.setItem('iqm_push_token',tok);}}catch(e){}
}
function renderPushBox(){
  const box=$('pushBox'); if(!box)return;
  const sup=pushSupport();
  if(sup==='ios-install'){box.innerHTML='На iPhone известията работят, когато магазинът е <strong>инсталиран</strong>: в Safari натисни „Сподели“ ⬆️ → „Добави към началния екран“, после го отвори от иконата и се върни тук.';return;}
  if(sup==='no'){box.innerHTML='Този браузър не поддържа известия. Опитай с Chrome.';return;}
  if(Notification.permission==='denied'){box.innerHTML='Известията са <strong>блокирани</strong> в браузъра. Разреши ги от настройките на сайта (катинарчето до адреса), после се върни тук.';return;}
  if(Notification.permission==='granted' && pushToken()){
    box.innerHTML='✅ <strong>Включени.</strong> Ще получаваш известие, когато поръчката е готова и тръгне към теб, и за новини.<br><button class="hbtn" id="pushOff" style="margin-top:8px">Изключи</button>';
    $('pushOff').onclick=disablePush; return;
  }
  box.innerHTML='Получавай известие, когато поръчката е готова и тръгне към теб, дори когато магазинът е затворен.<br><button class="hbtn primary" id="pushOn" style="margin-top:8px">🔔 Включи известията</button>';
  $('pushOn').onclick=enablePush;
}

async function checkout(){
  if(!cartArr().length)return;
  if(!USER||!PROFILE){authModal('login');return;}
  PM='cash';
  const sub=subtotal();
  const minOrder=ZONE.min_order||0, fee=calcFee(sub);
  const belowMin = minOrder>0 && sub<minOrder;
  const weighted=cartArr().some(i=>i.product.is_weighted);
  const finalTot = sub + fee;
  // Живо работно време на складовете от количката
  const whIds=[...new Set(cartArr().map(i=>i.product.warehouse_id))];
  let whRows=[]; try{const {data}=await sb.from('warehouses').select('id,name,working_hours').in('id',whIds); whRows=data||[];}catch(e){}
  const now=new Date();
  const closed=whRows.filter(w=>!isOpenAt(w.working_hours,now)).map(w=>w.name);
  const earliest=earliestDelivery(whRows.map(w=>w.working_hours),now);

    <label style="display:flex;justify-content:space-between;align-items:baseline">Адрес за доставка <a href="#" id="coAddrMgr" style="font-size:.82rem;font-weight:600">📍 Моите адреси</a></label>
    ${savedSel}

    <label>Желан час за доставка</label>
    <select id="coTime">${slots}</select>
    <label>Начин на плащане</label>
    <div class="paysel">
      <button type="button" class="payopt ${PM==='cash'?'active':''}" data-pm="cash">💵 В брой</button>
      <button type="button" class="payopt ${PM==='card'?'active':''}" data-pm="card">💳 Карта онлайн</button>
    </div>
    ${belowMin?`<div class="err">Минимална поръчка за ${escapeHtml(PROFILE.zone||'')}: ${money(minOrder)} · сега имаш ${money(sub)}</div>`:''}
    ${weighted?`<div class="info">⚖️ Част от продуктите са на килограм — крайната цена се определя след претегляне и ще получиш известие с точната сума.</div>`:''}
    <div class="rowb" style="margin-top:12px"><span class="muted">Продукти</span><span>${money(sub)}</span></div>
    <div class="rowb"><span class="muted">Доставка</span><span>${fee<=0?'<span style="color:var(--brand);font-weight:700">Безплатна</span>':money(fee)}</span></div>
    <div class="rowb" style="font-weight:800;font-size:1.05rem"><span>${weighted?'Общо (прогнозно)':'Общо'}</span><span>${money(finalTot)}</span></div>
    ${SETTINGS.vat?`<div class="rowb muted" style="font-size:.85rem"><span>в т.ч. ДДС ${VAT_PCT}%</span><span>${money(vatOf(finalTot))}</span></div>`:''}
    <div class="err" id="coErr"></div>

let CO_EARLIEST=null, CO_CLOSED=[];
async function placeOrder(){
  const err=$('coErr'); err.textContent='';
  const addr=$('coAddr').value.trim();
  if(!addr){err.textContent='Въведи адрес';return;}
  if(!CO_EARLIEST){err.textContent='Склад от количката в момента не приема поръчки.';return;}
  const pick=$('coTime')?.value||'';
  if(pick){const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(pick); const t=m&&new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
    if(t && t<new Date(Math.max(CO_EARLIEST,new Date())-60000)){err.textContent='Този час вече мина — избери по-късен.';return;}}
  if(CO_CLOSED.length && !confirm(`В момента е затворен: ${CO_CLOSED.join(', ')}.\nДоставяме, когато складът отвори — най-рано ${dtLabel(CO_EARLIEST)}.\n\nДа продължа ли?`))return;
  if(PM==='card' && !stripe){err.textContent='Плащането с карта не е достъпно в момента.';return;}
  const lbl = PM==='card'?'Плати с карта':'Поръчай сега';
  $('coGo').disabled=true; $('coGo').textContent='Момент…';
  try{
    const items=cartArr().map(i=>({product_id:i.product.id, qty:i.qty}));
    const dt=$('coTime')?.value||null;
    const {data:orderId,error}=await sb.rpc('create_order',{p_address:addr,p_payment_method:PM,p_delivery_time:dt,p_items:items});
    if(error){
      let m=error.message||'Грешка';
      if(/не е активен|без цена|Невалиден продукт/.test(m)){
        const id=(m.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/)||[])[0];
        const it=id&&CART[id];
        if(it){delete CART[id];saveCart();renderGrid();renderCart();m=`„${it.product.name}" вече не се предлага и е премахнат от кошницата. Провери поръчката и опитай пак.`;}
        else m='Продукт от кошницата вече не се предлага. Отвори кошницата и опитай пак.';
      }
      else if(m.includes('не доставяме до')) m='В момента не доставяме до твоето населено място. За въпроси: 0896 277 066.';
      else if(m.includes('под минимума')) m='Поръчката е под минимума за твоята зона.';
      err.textContent=m; $('coGo').disabled=false; $('coGo').textContent=lbl; return;
    }
    if(PM==='card'){ await payWithCard(orderId); return; }
    orderSuccess(orderId);
  }catch(e){err.textContent='Грешка: '+e.message;$('coGo').disabled=false;$('coGo').textContent=lbl;}
}
async function orderSuccess(orderId){
  CART={}; saveCart(); renderGrid(); closeCart();
  let total=null, orderNo=null;
  try{const {data:o}=await sb.from('orders').select('total,order_no').eq('id',orderId).maybeSingle();if(o){total=o.total;orderNo=o.order_no;}}catch(e){}
  openModal(`<div class="ok-box">

      <h2>Поръчката е приета!</h2>
      <p class="muted">Номер: #${orderNo??String(orderId).slice(0,8)}</p>
      ${total!=null?`<p><strong>Общо: ${money(total)}</strong></p>`:''}
      <p class="muted">Складът вече я вижда. Ще доставим възможно най-скоро.</p>
      <button class="big" id="okOrders">Проследи поръчката</button>
      <button class="big" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)" onclick="closeModal()">Разбрах</button>
    </div>`);
  $('okOrders').onclick=()=>ordersModal(null);
}
async function payWithCard(orderId){
  const err=$('coErr'); if(err)err.textContent='';
  let clientSecret;
  try{
    const {data,error}=await sb.functions.invoke('stripe-create-intent',{body:{order_id:orderId}});
    if(error||!data||!data.client_secret) throw new Error((data&&data.error)||'Неуспешно създаване на плащане');
    clientSecret=data.client_secret;
  }catch(e){
    await sb.rpc('cancel_my_unpaid_order',{p_order_id:orderId}).catch(()=>{});
    if($('coErr')){$('coErr').textContent='Грешка при плащане: '+e.message;$('coGo').disabled=false;$('coGo').textContent='Плати с карта';}
    return;
  }
  const elements=stripe.elements({clientSecret, appearance:{theme: isDarkNow()?'night':'stripe'}});
  const pe=elements.create('payment');
  openModal(`
    <h2>Плащане с карта</h2>
    <p class="muted" style="font-size:.85rem;margin:4px 0 0">Сумата се резервира сега и се таксува при приготвяне на поръчката.</p>
    <div id="payEl" style="margin:16px 0"></div>
    <div class="err" id="payErr"></div>
    <button class="big" id="payGo">Плати</button>
    <button class="big" id="payCancel" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)">Отказ</button>
  `);
  pe.mount('#payEl');
  MODAL_BACK=()=>{const c=$('payCancel');if(c)c.click();};   // „назад“ = Отказ (отменя неплатената поръчка)
  $('payCancel').onclick=async()=>{await sb.rpc('cancel_my_unpaid_order',{p_order_id:orderId}).catch(()=>{});closeModal();toast('Плащането е отказано');};
  $('payGo').onclick=async()=>{
    $('payGo').disabled=true; $('payGo').textContent='Обработка…'; $('payErr').textContent='';
    const {error}=await stripe.confirmPayment({elements, redirect:'if_required'});
    if(error){$('payErr').textContent=error.message||'Плащането не бе прието';$('payGo').disabled=false;$('payGo').textContent='Плати';return;}
    orderSuccess(orderId);
  };
}

// разстояние и очаквано време до доставчика (като order_screen.dart + location_utils.dart: права линия, 30 км/ч)
function haversineKm(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dg=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function etaText(km){const m=Math.max(1,Math.round(km/30*60));if(m<60)return `~${m} мин.`;const h=Math.floor(m/60),mm=m%60;return `~${h} ч. ${mm>0?mm+' мин.':''}`;}
function showEta(o,lat,lng){const el=$('odEta');if(!el)return;const km=haversineKm(+lat,+lng,+o.client_lat,+o.client_lng);
  el.innerHTML=`📏 Разстояние: <strong>${km.toFixed(1)} км</strong><br>⏱️ Очаквано: <strong>${etaText(km)}</strong>`;}
function stopDriverWatch(){if(DRV_CHAN){try{sb.removeChannel(DRV_CHAN);}catch(e){}}DRV_CHAN=null;DRV_ID=null;}
async function watchDriver(o){
  try{const {data}=await sb.from('driver_locations').select('lat,lng').eq('driver_id',o.driver_id).maybeSingle();if(data&&data.lat!=null)showEta(o,data.lat,data.lng);}catch(e){}
  if(DRV_CHAN&&DRV_ID===o.driver_id)return;
  stopDriverWatch(); DRV_ID=o.driver_id;
  DRV_CHAN=sb.channel('driver_loc_'+o.driver_id).on('postgres_changes',{event:'*',schema:'public',table:'driver_locations',filter:'driver_id=eq.'+o.driver_id},pl=>{
    const r=(pl&&pl.new)||{}; if(r.lat!=null&&OD_ID===o.id)showEta(o,r.lat,r.lng);
  }).subscribe();
}

  let results={}, total=0, myVote=null;
  try{const {data:r}=await sb.rpc('get_poll_results',{p_poll_id:p.id});(r||[]).forEach(x=>{results[x.option_index]=x.vote_count;total+=x.vote_count;});}catch(e){}
  if(USER){try{const {data:mv}=await sb.rpc('get_my_vote',{p_poll_id:p.id});if(mv!==null&&mv!==undefined)myVote=mv;}catch(e){}}
  const voted = myVote!==null;
  const el=document.createElement('div'); el.className='info'; el.style.display='block'; el.style.color='var(--ink)';
  el.innerHTML=`<div style="font-weight:600;margin-bottom:8px">${escapeHtml(p.question||'')}</div>`+
    opts.map((o,i)=>{
      const c=results[i]||0, pct=total?Math.round(c*100/total):0, mine=i===myVote;
      if(voted||!USER){
        return `<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>${escapeHtml(String(o))} ${mine?'✓':''}</span><span class="muted">${pct}% (${c})</span></div><div style="height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${pct}%;background:var(--brand)"></div></div></div>`;
      }
      return `<button class="hbtn" style="display:block;width:100%;text-align:left;margin:5px 0" data-poll="${p.id}" data-opt="${i}">${escapeHtml(String(o))}</button>`;
    }).join('') + (!USER?'<div class="muted" style="font-size:.8rem;margin-top:6px">Влез, за да гласуваш.</div>':'');
  wrap.appendChild(el);
  el.querySelectorAll('[data-poll]').forEach(b=>b.onclick=async()=>{try{await sb.rpc('vote_poll',{p_poll_id:b.dataset.poll,p_option_index:+b.dataset.opt});toast('Благодарим за гласа!');newsModal();}catch(e){toast('Грешка при гласуване');}});
}

// ---------- тема (тъмна по подразбиране) ----------
// светла / тъмна / като телефона (system) + основен цвят от 6 (като theme.dart в приложението)
function getTheme(){try{const t=localStorage.getItem('iqm_theme');return t==='light'||t==='system'?t:'dark';}catch(e){return 'dark';}}
function isDarkNow(){const t=getTheme();return t==='dark'||(t==='system'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(m){m=(m==='light'||m==='system')?m:'dark';document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('iqm_theme',m);}catch(e){}
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',isDarkNow()?'#141C16':'#FFFFFF');
  applyAccent();}
const ACCENTS=[['Зелено',''],['Синьо','#1E88E5'],['Червено','#E53935'],['Лилаво','#6A4CA5'],['Оранжево','#E67817'],['Тюркоаз','#00897B']];
function getAccent(){try{return localStorage.getItem('iqm_accent')||'';}catch(e){return '';}}
function mixHex(hex,to,t){const a=parseInt(hex.slice(1),16),b=parseInt(to.slice(1),16);const ch=s=>Math.round(((a>>s)&255)*(1-t)+((b>>s)&255)*t);return '#'+[16,8,0].map(s=>ch(s).toString(16).padStart(2,'0')).join('');}
function applyAccent(c){
  if(c!==undefined){try{c?localStorage.setItem('iqm_accent',c):localStorage.removeItem('iqm_accent');}catch(e){}}
  const a=getAccent(), st=document.documentElement.style;
  if(!a){st.removeProperty('--brand');st.removeProperty('--brand-deep');return;}   // зелено = цветовете на сайта
  const dark=isDarkNow();   // на тъмен фон — малко по-светъл тон, за да се чете текстът
  st.setProperty('--brand', dark?mixHex(a,'#ffffff',.18):a);
  st.setProperty('--brand-deep', dark?a:mixHex(a,'#000000',.2));
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='system')applyTheme('system');});}catch(e){}
// нова обява → червената точка на камбанката веднага (като news_icon_button.dart)
try{sb.channel('news_badge').on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'},()=>loadNewsBadge()).subscribe();}catch(e){}

// ---------- инсталиране като приложение (PWA) ----------
// Android/компютър (Chrome, Edge, Samsung Internet): бутон „Инсталирай“ чрез beforeinstallprompt.
// iPhone/iPad (Safari): няма такъв бутон в браузъра → показваме кратко упътване.
// Не се показва, ако магазинът вече е отворен като приложение или клиентът е скрил лентата.
let deferredInstall=null;
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function installHidden(){try{return localStorage.getItem('iqm_install_hide')==='1';}catch(e){return false;}}
function showInstallBar(mode){
  if(isStandalone()||installHidden())return;
  if(mode==='ios'){
    $('installText').textContent='В Safari натисни „Сподели“ (квадратчето със стрелка ⬆️) и после „Добави към началния екран“.';
    $('installBtn').hidden=true;
  }else if(mode==='android'){
    $('installText').textContent='Отвори менюто ⋮ на браузъра и избери „Инсталирай приложението“ или „Добави към началния екран“.';
    $('installBtn').hidden=true;
  }else{
    $('installText').textContent='Отваряй магазина с едно докосване от началния екран.';
    $('installBtn').hidden=false;
  }
  $('installBar').classList.toggle('has-btn',mode==='prompt');
  $('installBar').hidden=false;
}
window.__iqmOnInstall=e=>{deferredInstall=e;showInstallBar('prompt');};
if(window.__iqmInstall)window.__iqmOnInstall(window.__iqmInstall);
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('installBar').hidden=true;toast('IQ Market е инсталиран ✓');});
$('installBtn').onclick=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  try{await deferredInstall.userChoice;}catch(e){}
  deferredInstall=null;$('installBar').hidden=true;
};
$('installClose').onclick=()=>{$('installBar').hidden=true;try{localStorage.setItem('iqm_install_hide','1');}catch(e){}};
(function(){
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const safari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram/.test(ua);
  if(ios&&safari)showInstallBar('ios');
  // Android: Chrome праща предложението със закъснение (виждано до ~13 сек.) или изобщо не го праща
  // (Firefox, вече отказано). Ако не дойде до 12 сек., показваме упътване към менюто.
  const android=/Android/.test(ua)&&!/FBAN|FBAV|Instagram|; wv\)/.test(ua);
  if(android)setTimeout(()=>{if(!deferredInstall&&$('installBar').hidden)showInstallBar('android');},12000);
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

// височината на горната лента → --hdr (за залепения ред с категории и известията на телефон)
(function(){const h=document.querySelector('header');if(!h)return;
  const set=()=>document.documentElement.style.setProperty('--hdr',h.offsetHeight+'px');
  set();if(window.ResizeObserver)new ResizeObserver(set).observe(h);else window.addEventListener('resize',set);})();

// ---------- бутонът „назад“ на телефона (като в приложение) ----------
// Отворен прозорец (профил, кошница, продукт, снимка) = един запис в историята. „Назад“ го затваря
// или връща към предишния екран (адреси → профил, поръчка → списък). На основния екран: категория/търсене →
// „Всички“; на „Всички“ първото „назад“ предупреждава, второто излиза от приложението.
function catMenuOpen(){const sd=document.querySelector('.side');return !!sd&&sd.classList.contains('open');}
function setCatMenu(open){
  const sd=document.querySelector('.side'); if(!sd||catMenuOpen()===open)return;
  sd.classList.toggle('open',open); $('catBtn').setAttribute('aria-expanded',String(open)); $('catBack').hidden=!open;
  if(open)ovlPush(); else ovlDone();   // „назад“ затваря списъка
}
function anyOverlay(){return $('modal').classList.contains('open')||$('drawer').classList.contains('open')||$('lightbox').classList.contains('open')||catMenuOpen();}
function ensureGuard(){if(EXIT_ARMED){EXIT_ARMED=false;clearTimeout(exitT);try{history.pushState({iqm:'guard'},'');}catch(e){}}}
function ovlPush(){if(OVL)return;ensureGuard();try{history.pushState({iqm:'ovl'},'');OVL=true;}catch(e){}}
// затворено от бутон/×: махаме записа (след миг — ако веднага се отваря друг прозорец, записът остава за него)
function ovlDone(){setTimeout(()=>{if(OVL&&!anyOverlay()){OVL=false;IGNORE_POP=true;history.back();}},0);}
function backOverlay(){
  const lb=$('lightbox').classList.contains('open'), md=$('modal').classList.contains('open'), dr=$('drawer').classList.contains('open');
  if(lb){$('lightbox').classList.remove('open'); if(md||dr)ovlPush(); return;}
  if(md){
    const f=MODAL_BACK; MODAL_BACK=null;
    if(f){f(); return;}                       // предишният екран (сам си прави нов запис)
    $('modal').classList.remove('open'); if(dr)ovlPush(); return;
  }
  if(dr){$('overlay').classList.remove('open');$('drawer').classList.remove('open'); if(catMenuOpen())ovlPush(); return;}
  if(catMenuOpen()){document.querySelector('.side').classList.remove('open');$('catBtn').setAttribute('aria-expanded','false');$('catBack').hidden=true;}
}
window.addEventListener('popstate',()=>{
  if(IGNORE_POP){IGNORE_POP=false;return;}
  if(OVL){OVL=false;backOverlay();return;}
  if(CAT!=='Всички'||SEARCH.trim()){         // от категория/търсене → към началото
    CAT='Всички';SEARCH='';$('search').value='';renderCats();renderGrid();window.scrollTo({top:0});
    try{history.pushState({iqm:'guard'},'');}catch(e){} return;
  }
  toast('Натисни „назад“ още веднъж за изход');
  EXIT_ARMED=true; clearTimeout(exitT);
  exitT=setTimeout(()=>{if(EXIT_ARMED){EXIT_ARMED=false;try{history.pushState({iqm:'guard'},'');}catch(e){}}},2500);
});
try{const st=history.state&&history.state.iqm;   // при презареждане историята се пази → не трупаме записи
  if(!st){history.replaceState({iqm:'base'},'');history.pushState({iqm:'guard'},'');}
  else if(st==='base')history.pushState({iqm:'guard'},'');
  else if(st!=='guard')history.replaceState({iqm:'guard'},'');
}catch(e){}

// ---------- превъртане: лентата се крие надолу / показва нагоре; бутон „↑ към началото“ ----------
(function(){
  let lastY=window.scrollY, ticking=false;
  const tb=$('toolbar'), top=$('toTop');
  function update(){
    ticking=false;
    const y=window.scrollY, dy=y-lastY;
    const keep = catMenuOpen() || document.activeElement===$('search') || y<240;   // не крий: отворено меню, пише се, близо до началото
    if(keep) tb.classList.remove('hide');
    else if(dy>6) tb.classList.add('hide');       // надолу
    else if(dy<-6) tb.classList.remove('hide');   // нагоре — показва се веднага
    if(Math.abs(dy)>6||keep) lastY=y;
    top.hidden = y<700;
  }
  window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update);}},{passive:true});
  top.onclick=()=>{tb.classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});};
  $('search').addEventListener('focus',()=>tb.classList.remove('hide'));
})();

applyTheme(getTheme());
renderCartBadge();
refreshUser();
loadCatalog();
loadAnnounce();
loadNewsBadge();
