<title>Магазин — IQ Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{
    --bg:#F5F7F1;--surface:#FFFFFF;--surface-2:#EEF3EA;--ink:#152418;--ink-soft:#4C5B51;--ink-faint:#7A897F;
    --brand:#128A3E;--brand-deep:#0B6B2E;--line:#DCE4D6;--danger:#C0392B;--maxw:1760px;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D130F;--surface:#141C16;--surface-2:#1B241D;--ink:#EAF3EC;--ink-soft:#A3B4A8;--ink-faint:#7E9084;
    --brand:#34C267;--brand-deep:#27A557;--line:#26322B;}}
  :root[data-theme="dark"]{
    --bg:#0D130F;--surface:#141C16;--surface-2:#1B241D;--ink:#EAF3EC;--ink-soft:#A3B4A8;--ink-faint:#7E9084;
    --brand:#34C267;--brand-deep:#27A557;--line:#26322B;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;color:var(--ink)}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--brand),var(--brand-deep));display:grid;place-items:center}
  .mark svg{width:19px;height:19px}
  .spacer{flex:1}
  .hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:600}
  .hbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .cart-btn{position:relative}
  .deliverbar{padding:7px 14px;font-size:.86rem;background:var(--surface-2);border-top:1px solid var(--line);color:var(--ink-soft);text-align:center}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:20px;font-size:.7rem;
    min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
  /* layout */
  main{max-width:var(--maxw);margin:0 auto;padding:16px 14px}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1rem;margin-bottom:14px}
  /* layout: категории отстрани + съдържание */
  .layout{display:grid;grid-template-columns:214px 1fr;gap:20px;align-items:start}
  .side{position:sticky;top:80px}
  .side-title{font-size:.75rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px 6px}
  .catlist{display:flex;flex-direction:column;gap:2px}
  .catlink{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;color:var(--ink-soft);
    font-weight:600;font-size:.9rem;border:1px solid transparent;text-align:left;background:transparent;width:100%}
  .catlink .cnt{margin-left:auto;font-size:.74rem;color:var(--ink-faint)}
  .catlink:hover{background:var(--surface)}
  .catlink.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .catlink.active .cnt{color:#e6ffee}
  @media(max-width:760px){
    .layout{grid-template-columns:1fr;gap:8px}
    .side{position:static}
    .side-title{display:none}
    .catlist{flex-direction:row;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
    .catlink{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:7px 13px}
    .catlink .cnt{display:none}
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card .img,.card .name{cursor:pointer}
  /* детайл на продукт */
  .det-img{width:100%;aspect-ratio:16/10;background:var(--surface-2);border-radius:12px;display:grid;place-items:center;overflow:hidden;font-size:3rem}
  .det-img img{width:100%;height:100%;object-fit:contain}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card .img{position:relative;aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
  .fav{position:absolute;top:6px;right:6px;border:none;background:rgba(255,255,255,.92);color:#C0392B;width:30px;height:30px;border-radius:50%;font-size:1.05rem;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1}
  .fav.on{background:#C0392B;color:#fff}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .card .img .ph{font-size:2.4rem;opacity:.5}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .name{font-size:.92rem;font-weight:600;line-height:1.25;min-height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .brand-s{font-size:.75rem;color:var(--ink-faint)}
  .price{font-weight:800;color:var(--brand);font-size:1.05rem}
  .price .old{font-weight:500;color:var(--ink-faint);text-decoration:line-through;font-size:.8rem;margin-left:5px}
  .addrow{margin-top:auto;display:flex;align-items:center;gap:8px}
  .add{flex:1;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:.88rem}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--brand);border-radius:10px;overflow:hidden;flex:1}
  .stepper button{background:var(--surface);color:var(--brand);border:none;width:34px;height:36px;font-size:1.2rem;font-weight:700}
  .stepper .q{flex:1;text-align:center;font-weight:700;font-size:.9rem}
  .muted{color:var(--ink-faint)}
  .center{text-align:center;padding:50px 20px;color:var(--ink-faint)}
  /* drawer + modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  .overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg);z-index:50;
    transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer header{position:static}
  .dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
  .dhead h2{margin:0;font-size:1.15rem}
  .x{margin-left:auto;border:none;background:transparent;font-size:1.5rem;color:var(--ink-soft);line-height:1}
  .ditems{flex:1;overflow-y:auto;padding:12px 16px}
  .citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .citem .ci-img{width:52px;height:52px;border-radius:10px;background:var(--surface-2);object-fit:cover;flex-shrink:0}
  .citem .ci-name{font-size:.86rem;font-weight:600;line-height:1.2}
  .citem .ci-price{font-size:.8rem;color:var(--ink-faint)}
  .dfoot{border-top:1px solid var(--line);padding:16px 18px;background:var(--surface)}
  .rowb{display:flex;justify-content:space-between;align-items:center;margin:5px 0}
  .big{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:800;width:100%;margin-top:10px}
  .big:disabled{opacity:.5}
  /* modal (auth/checkout) */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
  .modal.open{display:flex}
  .sheet{background:var(--bg);border-radius:16px;width:min(440px,100%);max-height:92vh;overflow-y:auto;padding:22px}
  .sheet h2{margin:0 0 4px}
  .tabs{display:flex;gap:6px;margin:14px 0}
  .tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;font-weight:700}
  .tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px;color:var(--ink-soft)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem;font-family:inherit}
  .err{color:var(--danger);font-size:.85rem;margin-top:10px;min-height:1em}
  .ok-box{text-align:center;padding:16px}
  .ok-box .big-check{font-size:3rem}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:12px 18px;border-radius:12px;z-index:80;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:.96}
  .info{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--ink-soft);margin:10px 0}
  .det-img{cursor:zoom-in}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .paysel{display:flex;gap:8px;margin-top:6px}
  .payopt{flex:1;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;font-weight:700;font-size:.9rem}
  .payopt.active{border-color:var(--brand);color:var(--brand);background:var(--surface-2)}
  .ordrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;color:var(--ink)}
  .stbadge{color:#fff;border-radius:20px;padding:5px 12px;font-size:.78rem;font-weight:700;white-space:nowrap}
</style>

<script>try{var _t=localStorage.getItem('iqm_theme');document.documentElement.setAttribute('data-theme',_t==='light'?'light':'dark');}catch(e){}</script>
<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l1.5 10.5a1.5 1.5 0 0 0 1.5 1.3h7.6a1.5 1.5 0 0 0 1.5-1.2L21 8H7"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg></span>
      IQ Market
    </a>
    <span class="spacer"></span>
    <button class="hbtn cart-btn" id="newsBtn" title="Известия и анкети">🔔<span class="badge" id="newsBadge" hidden>0</span></button>
    <button class="hbtn" id="accountBtn">Вход</button>
    <button class="hbtn cart-btn" id="cartBtn">🛒 Кошница
      <span class="badge" id="cartBadge" hidden>0</span>
    </button>
  </div>
  <div id="deliverbar" class="deliverbar" hidden></div>
</header>

<main>
  <div id="announce"></div>
  <input class="search" id="search" placeholder="Търсене на продукт...">
  <div class="layout">
    <aside class="side">
      <div class="side-title">Категории</div>
      <div class="catlist" id="cats"></div>
    </aside>
    <section class="content">
      <div id="grid" class="grid"></div>
      <div id="status" class="center">Зареждане…</div>
    </section>
  </div>
</main>

<!-- Кошница -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><h2>Кошница</h2><button class="x" id="closeCart">×</button></div>
  <div class="ditems" id="cartItems"></div>
  <div class="dfoot">
    <div class="rowb"><span class="muted">Междинна сума</span><strong id="subtotal">0.00 €</strong></div>
    <div class="rowb" id="feeRow" hidden><span class="muted">Доставка</span><span id="fee">—</span></div>
    <div class="rowb" id="minRow" hidden></div>
    <button class="big" id="checkoutBtn">Поръчай</button>
  </div>
</aside>

<!-- Модал (вход/регистрация/поръчка/успех) -->
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://opmnvrwnsqblyrtlogcj.supabase.co';
const SUPABASE_KEY='sb_publishable_UFfbSRU_PyRjPYguKutlyg_d6QS56hn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// Stripe (ТЕСТОВ ключ; смени с pk_live_... след регистрация на фирмата)
const STRIPE_PK='pk_test_51U7vP9FjuiJdfYLkYQkL6mIHb5PVwLGMZEmEeIq21j77iqRz5h1eaqTcP6mvQ4CAvS1JKSvOJDN6pruBUd7q45yo00wACLkUyD';
const stripe = (typeof Stripe!=='undefined')? Stripe(STRIPE_PK): null;
let PM='cash';

const CAT_EMOJI={'Всички':'🛒','Консерви':'🥫','Хранителни':'🍝','За дома':'🧽','Захарни':'🍬','Напитки':'🥤','Млечни':'🥛','Олио и подправки':'🫒','Месо':'🥩','Хляб и сладкиши':'🍫','Замразени':'❄️','Козметика':'🧴','Плодове и зеленчуци':'🥦','Суха храна':'🌾','Зеленчуци':'🥕','Плодове':'🍎'};
const CATALOG_COLS='id, warehouse_id, name, category, price, unit, image_url, description, brand, discount_percent, is_weighted, rating_override, votes_override';

const FAV_CAT='★ Моят магазин';
let PRODUCTS=[], CATS=['Всички'], HIDDEN=[], CAT='Всички', SEARCH='';
let CART=loadCart();       // {product_id: {product, qty}}
let USER=null, PROFILE=null, ZONE={min_order:0,delivery_fee:0,free_over:0}, FAVS=new Set();

// ---------- utils ----------
const $=id=>document.getElementById(id);
const money=n=>Number(n).toFixed(2)+' €';
const fmtQty=q=> q===Math.round(q)? String(q): String(q);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function discounted(p){return p.discount_percent>0? p.price*(1-p.discount_percent/100): p.price;}
function step(p){return p.is_weighted?0.5:1;}
function unitLabel(p){return p.is_weighted?'кг':(p.unit||'бр.');}
function calcFee(sub){const sf=ZONE.delivery_fee||0,mn=ZONE.min_order||0,fo=ZONE.free_over||0;if(sf<=0)return 0;if(fo<=mn)return sf;let f=sf*(fo-sub)/(fo-mn);if(f<0)f=0;if(f>sf)f=sf;return Math.round(f*100)/100;}
function stars(r){r=Number(r)||0;let h='';for(let i=1;i<=5;i++)h+=`<span style="color:${i<=Math.round(r)?'#F5A623':'var(--ink-faint)'}">★</span>`;return h;}
function loadCart(){try{return JSON.parse(localStorage.getItem('iqm_cart')||'{}');}catch(e){return {};}}
function saveCart(){localStorage.setItem('iqm_cart', JSON.stringify(CART));renderCartBadge();}

// ---------- каталог ----------
async function loadCatalog(){
  try{
    const {data:hs}=await sb.from('app_settings').select('value').eq('key','hidden_categories').maybeSingle();
    if(hs && Array.isArray(hs.value)) HIDDEN=hs.value;
  }catch(e){}
  const all=[]; let from=0;
  while(true){
    const {data,error}=await sb.from('products').select(CATALOG_COLS).eq('is_active',true).order('name').range(from,from+999);
    if(error){$('status').textContent='Грешка при зареждане: '+error.message;return;}
    all.push(...data); if(data.length<1000)break; from+=1000;
  }
  PRODUCTS=all.filter(p=>!HIDDEN.includes(p.category));
  const set=[...new Set(PRODUCTS.map(p=>p.category).filter(Boolean))].sort();
  CATS=['Всички',...set];
  $('status').style.display='none';
  renderCats(); renderGrid();
}
function renderCats(){
  const counts={}; PRODUCTS.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);
  const list = PROFILE? [FAV_CAT,...CATS] : CATS;
  $('cats').innerHTML=list.map(c=>{
    const n= c===FAV_CAT? FAVS.size : (c==='Всички'?PRODUCTS.length:(counts[c]||0));
    const emo= c===FAV_CAT? '★' : (CAT_EMOJI[c]||'🏷️');
    return `<button class="catlink ${c===CAT?'active':''}" data-c="${c}">${emo} <span>${c}</span><span class="cnt">${n}</span></button>`;
  }).join('');
  $('cats').querySelectorAll('.catlink').forEach(b=>b.onclick=()=>{CAT=b.dataset.c;SEARCH='';$('search').value='';renderCats();renderGrid();window.scrollTo({top:0,behavior:'smooth'});});
}
function renderGrid(){
  let list=PRODUCTS;
  if(CAT===FAV_CAT) list=list.filter(p=>FAVS.has(p.id));
  else if(CAT!=='Всички') list=list.filter(p=>p.category===CAT);
  if(SEARCH.trim()){const q=SEARCH.trim().toLowerCase();list=list.filter(p=>(p.name||'').toLowerCase().includes(q));}
  if(CAT===FAV_CAT && !list.length){$('grid').innerHTML='<div class="center">Твоят магазин е празен.<br>Натисни ♡ на продукт, за да го добавиш тук за бърза поръчка.</div>';return;}
  if(!list.length){$('grid').innerHTML='<div class="center">Няма намерени продукти</div>';return;}
  $('grid').innerHTML=list.map(p=>{
    const inCart=CART[p.id];
    const dp=discounted(p), has=p.discount_percent>0, priced=dp>0;
    const img=p.image_url?`<img src="${p.image_url}" loading="lazy" alt="">`:`<span class="ph">🛒</span>`;
    const priceHtml= priced
      ? `<div class="price">${money(dp)}${p.is_weighted?'<span class="muted" style="font-size:.7rem">/кг</span>':''}${has?`<span class="old">${money(p.price)}</span>`:''}</div>`
      : `<div class="muted" style="font-size:.85rem;font-weight:600">Цена скоро</div>`;
    const control= !priced
      ? `<button class="add" disabled style="opacity:.5;cursor:default">Очаквайте</button>`
      : inCart
      ? `<div class="stepper"><button data-dec="${p.id}">−</button><span class="q">${fmtQty(inCart.qty)} ${unitLabel(p)}</span><button data-inc="${p.id}">＋</button></div>`
      : `<button class="add" data-add="${p.id}">Добави</button>`;
    const heart=PROFILE?`<button class="fav ${FAVS.has(p.id)?'on':''}" data-fav="${p.id}" title="Моят магазин">${FAVS.has(p.id)?'♥':'♡'}</button>`:'';
    const rating=(p.rating_override||p.votes_override)?`<div style="font-size:.8rem;line-height:1">${stars(p.rating_override)} <span class="muted">(${p.votes_override||0})</span></div>`:'';
    return `<div class="card">
      <div class="img" data-detail="${p.id}">${img}${heart}</div>
      <div class="body">
        ${p.brand?`<div class="brand-s">${p.brand}</div>`:''}
        <div class="name" data-detail="${p.id}">${p.name||''}</div>
        ${rating}
        ${priceHtml}
        <div class="addrow">${control}</div>
      </div></div>`;
  }).join('');
  $('grid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
  $('grid').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>changeQty(b.dataset.inc,1));
  $('grid').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>changeQty(b.dataset.dec,-1));
  $('grid').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));
  $('grid').querySelectorAll('[data-fav]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleFav(b.dataset.fav);});
}

// ---------- детайл на продукт ----------
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function openDetail(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p)return;
  const dp=discounted(p), has=p.discount_percent>0, priced=dp>0;
  openModal(`
    <button class="x" style="float:right;margin:-6px -6px 0 0" id="detX">×</button>
    <div style="clear:both"></div>
    <div class="det-img" id="detImg" style="cursor:${p.image_url?'zoom-in':'default'}">${p.image_url?`<img src="${p.image_url}" alt="">`:'🛒'}</div>
    ${p.brand?`<div class="brand-s" style="margin-top:12px">${escapeHtml(p.brand)}</div>`:''}
    <h2 style="margin:3px 0 6px">${escapeHtml(p.name||'')}</h2>
    ${priced
      ? `<div class="price" style="font-size:1.35rem">${money(dp)}${p.is_weighted?'<span class="muted" style="font-size:.8rem">/кг</span>':''}${has?`<span class="old">${money(p.price)}</span>`:''}</div>`
      : `<div class="muted" style="font-weight:700">Цена скоро</div>`}
    ${p.description
      ? `<p style="color:var(--ink-soft);font-size:.92rem;line-height:1.6;margin-top:14px;white-space:pre-wrap">${escapeHtml(p.description)}</p>`
      : `<p class="muted" style="margin-top:14px">Няма описание за този продукт.</p>`}
    <div id="detRating"></div>
    <div id="detCtl" style="margin-top:18px"></div>
  `);
  $('detX').onclick=closeModal;
  if(p.image_url){const di=$('detImg');if(di)di.onclick=()=>openLightbox(p.image_url);}
  renderDetailControl(p);
  loadRating(p);
}
function openLightbox(url){$('lbImg').src=url;$('lightbox').classList.add('open');}
async function loadRating(p){
  const el=$('detRating'); if(!el)return;
  let avg=Number(p.rating_override)||0, votes=Number(p.votes_override)||0, mine=0;
  try{const {data}=await sb.rpc('get_product_rating_stats',{p_product_id:p.id});if(data&&data[0]&&data[0].vote_count>0){avg=Number(data[0].avg_rating)||avg;votes=Number(data[0].vote_count)||votes;}}catch(e){}
  if(USER){try{const {data:mr}=await sb.from('product_ratings').select('rating').eq('product_id',p.id).eq('user_id',USER.id).maybeSingle();if(mr)mine=mr.rating;}catch(e){}}
  el.innerHTML=`
    <div style="margin-top:14px;display:flex;align-items:center;gap:8px"><span style="font-size:1.15rem">${stars(avg)}</span><span class="muted" style="font-size:.85rem">${avg?avg.toFixed(1):'—'} (${votes})</span></div>
    ${USER?`<div class="muted" style="margin-top:10px;font-size:.85rem">Твоята оценка:</div><div id="myStars" style="font-size:1.6rem;cursor:pointer;user-select:none">${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="color:${i<=mine?'#F5A623':'var(--ink-faint)'}">★</span>`).join('')}</div>`:''}`;
  if(USER)el.querySelectorAll('[data-r]').forEach(s=>s.onclick=async()=>{const r=+s.dataset.r;try{await sb.rpc('rate_product',{p_product_id:p.id,p_rating:r});toast('Благодарим за оценката!');loadRating(p);}catch(e){toast('Грешка');}});
}
function renderDetailControl(p){
  const el=$('detCtl'); if(!el)return;
  const priced=discounted(p)>0, it=CART[p.id];
  if(!priced){el.innerHTML=`<button class="big" disabled style="opacity:.5">Очаквайте цена</button>`;return;}
  if(it){
    el.innerHTML=`<div class="stepper"><button data-d>−</button><span class="q">${fmtQty(it.qty)} ${unitLabel(p)}</span><button data-i>＋</button></div>`;
    el.querySelector('[data-i]').onclick=()=>{changeQty(p.id,1);renderDetailControl(p);};
    el.querySelector('[data-d]').onclick=()=>{changeQty(p.id,-1);renderDetailControl(p);};
  }else{
    el.innerHTML=`<button class="big" id="detAdd">Добави в кошницата</button>`;
    $('detAdd').onclick=()=>{addToCart(p.id);renderDetailControl(p);};
  }
}

// ---------- кошница ----------
function addToCart(id){const p=PRODUCTS.find(x=>x.id===id);if(!p||discounted(p)<=0)return;CART[id]={product:p,qty:step(p)};saveCart();renderGrid();renderCart();toast(p.name+' е в кошницата');}
function changeQty(id,dir){const it=CART[id];if(!it)return;const s=step(it.product);it.qty=Math.round((it.qty+dir*s)*1000)/1000;if(it.qty<=0)delete CART[id];saveCart();renderGrid();renderCart();}
async function toggleFav(id){
  if(!USER){authModal('login');return;}
  if(FAVS.has(id)){FAVS.delete(id);sb.from('quick_order_items').delete().eq('client_id',USER.id).eq('product_id',id);}
  else{FAVS.add(id);sb.from('quick_order_items').upsert({client_id:USER.id,product_id:id,qty:1},{onConflict:'client_id,product_id'});toast('Добавено в „Моят магазин"');}
  renderGrid();renderCats();
}
function cartArr(){return Object.values(CART);}
function subtotal(){return cartArr().reduce((s,i)=>s+discounted(i.product)*i.qty,0);}
function renderCartBadge(){const n=cartArr().length;const b=$('cartBadge');b.textContent=n;b.hidden=n===0;renderDeliverBar();}
function renderDeliverBar(){
  const bar=$('deliverbar'); if(!bar)return;
  const sub=subtotal();
  if(sub<=0){bar.hidden=true;return;}
  let txt=`Кошница: <strong>${money(sub)}</strong>`;
  if(PROFILE && ZONE.delivery_fee>0){
    const fee=calcFee(sub), fo=ZONE.free_over||0, toFree=(fee>0&&fo>0)?(fo-sub):0;
    txt += fee<=0 ? ' · <strong style="color:var(--brand)">Безплатна доставка 🎉</strong>' : ` · Доставка: <strong>${money(fee)}</strong>`;
    if(toFree>0) txt += ` · <span style="color:var(--brand)">още ${money(toFree)} до безплатна доставка 🚚</span>`;
  }
  bar.innerHTML=txt; bar.hidden=false;
}
function renderCart(){
  const items=cartArr();
  $('cartItems').innerHTML= items.length? items.map(i=>{
    const p=i.product,img=p.image_url?`<img class="ci-img" src="${p.image_url}" alt="">`:`<div class="ci-img" style="display:grid;place-items:center">🛒</div>`;
    return `<div class="citem">${img}
      <div style="flex:1">
        <div class="ci-name">${p.name}</div>
        <div class="ci-price">${money(discounted(p))} × ${fmtQty(i.qty)} ${unitLabel(p)} = <strong>${money(discounted(p)*i.qty)}</strong></div>
      </div>
      <div class="stepper" style="width:104px;flex:none"><button data-dec="${p.id}">−</button><span class="q">${fmtQty(i.qty)}</span><button data-inc="${p.id}">＋</button></div>
    </div>`;
  }).join('') : '<div class="center">Кошницата е празна</div>';
  $('cartItems').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>changeQty(b.dataset.inc,1));
  $('cartItems').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>changeQty(b.dataset.dec,-1));
  const sub=subtotal();
  $('subtotal').textContent=money(sub);
  const fee=calcFee(sub);
  $('feeRow').hidden = !(PROFILE && ZONE.delivery_fee>0);
  $('fee').innerHTML = fee<=0? '<span style="color:var(--brand);font-weight:700">Безплатна</span>' : money(fee);
  const mn=ZONE.min_order||0, fo=ZONE.free_over||0, toFree=(fee>0&&fo>0)?(fo-sub):0;
  const belowMin = PROFILE && mn>0 && sub<mn;
  let mrow='';
  if(belowMin) mrow=`<span class="err" style="margin:0">Минимум за ${escapeHtml(PROFILE.zone||'')}: ${money(mn)}</span>`;
  else if(toFree>0) mrow=`<span style="color:var(--brand);font-size:.85rem">Още ${money(toFree)} до безплатна доставка 🚚</span>`;
  $('minRow').innerHTML=mrow; $('minRow').hidden=!mrow;
  const weighted=items.some(i=>i.product.is_weighted);
  $('checkoutBtn').disabled = items.length===0 || belowMin;
  $('checkoutBtn').textContent= belowMin? `Минимум ${money(mn)}` : (weighted? 'Поръчай (цена след претегляне)':'Поръчай');
}
function openCart(){renderCart();$('overlay').classList.add('open');$('drawer').classList.add('open');}
function closeCart(){$('overlay').classList.remove('open');$('drawer').classList.remove('open');}

    if(PROFILE.zone){try{const {data:z}=await sb.from('delivery_zones').select('min_order,delivery_fee,free_over').eq('name',PROFILE.zone).maybeSingle();if(z)ZONE={min_order:+z.min_order||0,delivery_fee:+z.delivery_fee||0,free_over:+z.free_over||0};}catch(e){}}
    try{const {data:q}=await sb.from('quick_order_items').select('product_id').eq('client_id',USER.id);FAVS=new Set((q||[]).map(r=>r.product_id));}catch(e){}

async function doLogin(){
  const err=$('authErr'); err.textContent='';
  const phone=clean($('lPhone').value), pass=$('lPass').value;
  if(!phone||!pass){err.textContent='Попълни телефон и парола';return;}
  $('doLogin').disabled=true;
  try{
    const {data:uid,error:e1}=await sb.rpc('get_id_by_phone',{phone_number:phone});
    if(e1||!uid){err.textContent='Телефонът не е регистриран';$('doLogin').disabled=false;return;}
    const {error:e2}=await sb.auth.signInWithPassword({email:uid+'@dostavka.app',password:pass});
    if(e2){err.textContent='Грешна парола';$('doLogin').disabled=false;return;}
    await refreshUser(); closeModal(); toast('Добре дошъл!');
  }catch(e){err.textContent='Грешка: '+e.message;$('doLogin').disabled=false;}
}
function genCode(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');}
async function doReg(){
  const err=$('authErr'); err.textContent='';
  const name=$('rName').value.trim(), phone=clean($('rPhone').value), zone=$('rZone').value,
        addr=$('rAddr').value.trim(), pass=$('rPass').value, ref=$('rRef').value.trim().toUpperCase();
  if(!name||!phone||!zone||!addr||!pass){err.textContent='Попълни всички полета';return;}
  if(phone.replace(/[^0-9]/g,'').length!==10){err.textContent='Телефонът трябва да е 10 цифри';return;}
  if(pass.length<6){err.textContent='Паролата трябва да е поне 6 символа';return;}
  $('doReg').disabled=true;
  try{
    const {data:ex}=await sb.from('profiles').select('id').eq('phone',phone).maybeSingle();
    if(ex){err.textContent='Този телефон вече е регистриран';$('doReg').disabled=false;return;}
    const uuid=crypto.randomUUID(); const email=uuid+'@dostavka.app';
    const {data:su,error:e1}=await sb.auth.signUp({email,password:pass});
    if(e1||!su.user){err.textContent='Регистрацията не успя: '+(e1?.message||'');$('doReg').disabled=false;return;}
    let referredBy=null;
    if(ref){const {data:r}=await sb.from('profiles').select('id').eq('referral_code',ref).maybeSingle();if(r)referredBy=ref;}
    const {error:e2}=await sb.from('profiles').insert({id:su.user.id,name,phone,role:'client',address:addr+', '+zone,zone,referral_code:genCode(),referred_by:referredBy,referral_discount:0});
    if(e2){err.textContent='Профилът не се създаде: '+e2.message;$('doReg').disabled=false;return;}
    await refreshUser(); closeModal(); toast('Акаунтът е създаден!');
  }catch(e){err.textContent='Грешка: '+e.message;$('doReg').disabled=false;}
}

// ---------- поръчка ----------
async function checkout(){
  if(!cartArr().length)return;
  if(!USER||!PROFILE){authModal('login');return;}
  PM='cash';
  const sub=subtotal();
  const minOrder=ZONE.min_order||0, fee=calcFee(sub);
  const belowMin = minOrder>0 && sub<minOrder;
  const weighted=cartArr().some(i=>i.product.is_weighted);
  const finalTot = sub + fee;
  let slots='<option value="">При първа възможност</option>';
  for(let h=9;h<=19;h++){slots+=`<option value="${String(h).padStart(2,'0')}:00">${String(h).padStart(2,'0')}:00 – ${String(h+1).padStart(2,'0')}:00</option>`;}
  openModal(`
    <h2>Потвърди поръчката</h2>
    <label>Адрес за доставка</label>
    <textarea id="coAddr" rows="2">${escapeHtml(PROFILE.address||'')}</textarea>
    <label>Желан час за доставка</label>
    <select id="coTime">${slots}</select>
    <label>Начин на плащане</label>
    <div class="paysel">
      <button type="button" class="payopt ${PM==='cash'?'active':''}" data-pm="cash">💵 В брой</button>
      <button type="button" class="payopt ${PM==='card'?'active':''}" data-pm="card">💳 Карта онлайн</button>
    </div>
    ${belowMin?`<div class="err">Минимална поръчка за ${escapeHtml(PROFILE.zone||'')}: ${money(minOrder)} · сега имаш ${money(sub)}</div>`:''}
    ${weighted?`<div class="info">⚖️ Част от продуктите са на килограм — крайната цена се определя след претегляне и ще получиш известие с точната сума.</div>`:''}
    <div class="rowb" style="margin-top:12px"><span class="muted">Продукти</span><span>${money(sub)}</span></div>
    <div class="rowb"><span class="muted">Доставка</span><span>${fee<=0?'<span style="color:var(--brand);font-weight:700">Безплатна</span>':money(fee)}</span></div>
    <div class="rowb" style="font-weight:800;font-size:1.05rem"><span>${weighted?'Общо (прогнозно)':'Общо'}</span><span>${money(finalTot)}</span></div>
    <div class="err" id="coErr"></div>
    <button class="big" id="coGo" ${belowMin?'disabled':''}>Поръчай сега</button>
  `);
  $('coGo').onclick=placeOrder;
  $('sheet').querySelectorAll('.payopt').forEach(b=>b.onclick=()=>{
    PM=b.dataset.pm;
    $('sheet').querySelectorAll('.payopt').forEach(x=>x.classList.toggle('active',x===b));
    $('coGo').textContent = PM==='card'?'Плати с карта':'Поръчай сега';
  });
}
async function placeOrder(){
  const err=$('coErr'); err.textContent='';
  const addr=$('coAddr').value.trim();
  if(!addr){err.textContent='Въведи адрес';return;}
  if(PM==='card' && !stripe){err.textContent='Плащането с карта не е достъпно в момента.';return;}
  const lbl = PM==='card'?'Плати с карта':'Поръчай сега';
  $('coGo').disabled=true; $('coGo').textContent='Момент…';
  try{
    const items=cartArr().map(i=>({product_id:i.product.id, qty:i.qty}));
    const dt=$('coTime')?.value||null;
    const {data:orderId,error}=await sb.rpc('create_order',{p_address:addr,p_payment_method:PM,p_delivery_time:dt,p_items:items});
    if(error){
      let m=error.message||'Грешка';
      if(m.includes('под минимума')) m='Поръчката е под минимума за твоята зона.';
      err.textContent=m; $('coGo').disabled=false; $('coGo').textContent=lbl; return;
    }
    if(PM==='card'){ await payWithCard(orderId); return; }
    orderSuccess(orderId);
  }catch(e){err.textContent='Грешка: '+e.message;$('coGo').disabled=false;$('coGo').textContent=lbl;}
}
async function orderSuccess(orderId){
  CART={}; saveCart(); renderGrid(); closeCart();
  let total=null;
  try{const {data:o}=await sb.from('orders').select('total').eq('id',orderId).maybeSingle();if(o)total=o.total;}catch(e){}
  openModal(`<div class="ok-box">
      <div class="big-check">✅</div>
      <h2>Поръчката е приета!</h2>
      <p class="muted">Номер: #${String(orderId).slice(0,8)}</p>
      ${total!=null?`<p><strong>Общо: ${money(total)}</strong></p>`:''}
      <p class="muted">Складът вече я вижда. Ще доставим възможно най-скоро.</p>
      <button class="big" id="okOrders">Проследи поръчката</button>
      <button class="big" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)" onclick="document.getElementById('modal').classList.remove('open')">Разбрах</button>
    </div>`);
  $('okOrders').onclick=ordersModal;
}
async function payWithCard(orderId){
  const err=$('coErr'); if(err)err.textContent='';
  let clientSecret;
  try{
    const {data,error}=await sb.functions.invoke('stripe-create-intent',{body:{order_id:orderId}});
    if(error||!data||!data.client_secret) throw new Error((data&&data.error)||'Неуспешно създаване на плащане');
    clientSecret=data.client_secret;
  }catch(e){
    await sb.rpc('cancel_my_unpaid_order',{p_order_id:orderId}).catch(()=>{});
    if($('coErr')){$('coErr').textContent='Грешка при плащане: '+e.message;$('coGo').disabled=false;$('coGo').textContent='Плати с карта';}
    return;
  }
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches;
  const elements=stripe.elements({clientSecret, appearance:{theme: dark?'night':'stripe'}});
  const pe=elements.create('payment');
  openModal(`
    <h2>Плащане с карта</h2>
    <p class="muted" style="font-size:.85rem;margin:4px 0 0">Сумата се резервира сега и се таксува при приготвяне на поръчката.</p>
    <div id="payEl" style="margin:16px 0"></div>
    <div class="err" id="payErr"></div>
    <button class="big" id="payGo">Плати</button>
    <button class="big" id="payCancel" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)">Отказ</button>
  `);
  pe.mount('#payEl');
  $('payCancel').onclick=async()=>{await sb.rpc('cancel_my_unpaid_order',{p_order_id:orderId}).catch(()=>{});closeModal();toast('Плащането е отказано');};
  $('payGo').onclick=async()=>{
    $('payGo').disabled=true; $('payGo').textContent='Обработка…'; $('payErr').textContent='';
    const {error}=await stripe.confirmPayment({elements, redirect:'if_required'});
    if(error){$('payErr').textContent=error.message||'Плащането не бе прието';$('payGo').disabled=false;$('payGo').textContent='Плати';return;}
    orderSuccess(orderId);
  };
}

// ---------- моите поръчки + проследяване ----------
const SUPPORT='0896277066';
const HIDDEN_PAY=['awaiting_payment','canceled','failed'];
const ORDER_STATUS={pending:['Приета','#E67E22'],preparing:['Приготвя се','#2980B9'],ready:['Готова','#27AE60'],on_the_way:['На път към теб','#E67E22'],delivered:['Доставена','#27AE60'],cancelled:['Отказана','#C0392B']};
function stInfo(s){return ORDER_STATUS[s]||['—','#777'];}
function fmtDate(iso){try{const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`;}catch(e){return '';}}
let ordersChan=null;
function watchOrders(){
  if(ordersChan||!USER)return;
  ordersChan=sb.channel('orders_'+USER.id).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'client_id=eq.'+USER.id},()=>{ if($('ordList'))renderOrders(); }).subscribe();
}
async function ordersModal(){
  if(!USER){authModal('login');return;}
  openModal(`<button class="x" style="float:right;margin:-6px -6px 0 0" onclick="document.getElementById('modal').classList.remove('open')">×</button><div style="clear:both"></div><h2>Моите поръчки</h2><div id="ordList"><div class="center">Зареждане…</div></div>`);
  renderOrders();
}
async function renderOrders(){
  const box=$('ordList'); if(!box)return;
  const {data,error}=await sb.from('orders').select('id,status,total,client_address,created_at,payment_status').eq('client_id',USER.id).order('created_at',{ascending:false}).limit(40);
  if(error){box.innerHTML='<div class="center">Грешка при зареждане</div>';return;}
  const list=(data||[]).filter(o=>!HIDDEN_PAY.includes(o.payment_status));
  if(!list.length){box.innerHTML='<div class="center">Нямаш поръчки още</div>';return;}
  box.innerHTML=list.map(o=>{const[t,c]=stInfo(o.status);return `<button class="ordrow" data-o="${o.id}">
    <div><div style="font-weight:700">Поръчка #${String(o.id).slice(0,8)}</div><div class="muted" style="font-size:.8rem">${fmtDate(o.created_at)} · ${money(o.total)}</div></div>
    <span class="stbadge" style="background:${c}">${t}</span></button>`;}).join('');
  box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>orderDetail(b.dataset.o));
}
async function orderDetail(id){
  openModal(`<button class="x" style="float:right;margin:-6px -6px 0 0" id="odBack">←</button><div style="clear:both"></div><div id="odBody"><div class="center">Зареждане…</div></div>`);
  $('odBack').onclick=ordersModal;
  const [{data:o},{data:items}]=await Promise.all([
    sb.from('orders').select('*').eq('id',id).maybeSingle(),
    sb.from('order_items').select('*, products(name,unit,is_weighted)').eq('order_id',id)
  ]);
  if(!o){const b=$('odBody');if(b)b.innerHTML='<div class="center">Няма такава поръчка</div>';return;}
  const[t,c]=stInfo(o.status);
  const pend=(items||[]).some(i=>i.products?.is_weighted && i.actual_qty==null);
  const its=(items||[]).map(i=>{const nm=i.products?.name||'';const w=i.products?.is_weighted;const q=(i.actual_qty??i.qty);const u=w?'кг':(i.products?.unit||'бр.');
    return `<div class="rowb"><span>${escapeHtml(nm)} × ${fmtQty(q)} ${u}${w&&i.actual_qty==null?' (претегля се)':''}</span><span>${money((i.price||0)*q)}</span></div>`;}).join('');
  const b=$('odBody'); if(!b)return;
  b.innerHTML=`
    <h2 style="margin:2px 0 8px">Поръчка #${String(id).slice(0,8)}</h2>
    <div style="text-align:center;margin:10px 0"><span class="stbadge" style="background:${c};font-size:1rem;padding:8px 18px">${t}</span></div>
    ${o.status==='on_the_way'?'<div class="info">🚴 Доставчикът е на път към теб!</div>':''}
    <div class="info">📍 ${escapeHtml(o.client_address||'')}</div>
    <div style="margin:14px 0 6px;font-weight:700">Артикули</div>
    ${its||'<div class="muted">—</div>'}
    <div class="rowb" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:800"><span>${pend?'Общо (прогнозно)':'Общо'}</span><span>${money(o.total)}</span></div>
    ${pend?'<div class="muted" style="font-size:.8rem;margin-top:6px">⚖️ Част от продуктите се претеглят — крайната цена може леко да варира.</div>':''}
    <div class="info" style="margin-top:14px">При проблем: <a href="tel:${SUPPORT}">${SUPPORT}</a></div>`;
}

// ---------- известия + анкети ----------
let NEWS_IDS=[];
async function loadNewsBadge(){
  try{
    const [{data:a},{data:p}]=await Promise.all([
      sb.from('announcements').select('id').eq('is_active',true),
      sb.from('polls').select('id').eq('is_active',true)
    ]);
    NEWS_IDS=[...(a||[]).map(x=>'a'+x.id),...(p||[]).map(x=>'p'+x.id)];
    let seen=[]; try{seen=JSON.parse(localStorage.getItem('iqm_seen_news')||'[]');}catch(e){}
    const unseen=NEWS_IDS.filter(i=>!seen.includes(i)).length;
    const b=$('newsBadge'); if(b){b.textContent=unseen;b.hidden=unseen===0;}
  }catch(e){}
}
function markNewsSeen(){try{localStorage.setItem('iqm_seen_news',JSON.stringify(NEWS_IDS));}catch(e){}const b=$('newsBadge');if(b)b.hidden=true;}
async function newsModal(){
  markNewsSeen();
  openModal(`<button class="x" style="float:right;margin:-6px -6px 0 0" onclick="document.getElementById('modal').classList.remove('open')">×</button><div style="clear:both"></div><h2>Известия</h2><div id="newsBody"><div class="center">Зареждане…</div></div>`);
  const [{data:anns},{data:polls}]=await Promise.all([
    sb.from('announcements').select('title,body,created_at').eq('is_active',true).order('created_at',{ascending:false}),
    sb.from('polls').select('id,question,options').eq('is_active',true).order('created_at',{ascending:false})
  ]);
  let html='';
  if(anns&&anns.length){html+='<div style="font-weight:700;margin:6px 0 4px">📣 Обяви</div>'+anns.map(a=>`<div class="info" style="color:var(--ink)"><strong>${escapeHtml(a.title||'')}</strong>${a.body?`<div>${escapeHtml(a.body)}</div>`:''}<div class="muted" style="font-size:.75rem;margin-top:4px">${fmtDate(a.created_at)}</div></div>`).join('');}
  if(polls&&polls.length){html+='<div style="font-weight:700;margin:14px 0 4px">🗳️ Анкети</div><div id="pollsWrap"></div>';}
  const b=$('newsBody'); if(!b)return;
  b.innerHTML= html || '<div class="center">Няма нови известия</div>';
  if(polls&&polls.length){for(const p of polls){await renderPoll(p);}}
}
async function renderPoll(p){
  const wrap=$('pollsWrap'); if(!wrap)return;
  let opts=p.options; if(typeof opts==='string'){try{opts=JSON.parse(opts);}catch(e){opts=[];}}
  if(!Array.isArray(opts))opts=[];
  let results={}, total=0, myVote=null;
  try{const {data:r}=await sb.rpc('get_poll_results',{p_poll_id:p.id});(r||[]).forEach(x=>{results[x.option_index]=x.vote_count;total+=x.vote_count;});}catch(e){}
  if(USER){try{const {data:mv}=await sb.rpc('get_my_vote',{p_poll_id:p.id});if(mv!==null&&mv!==undefined)myVote=mv;}catch(e){}}
  const voted = myVote!==null;
  const el=document.createElement('div'); el.className='info'; el.style.display='block'; el.style.color='var(--ink)';
  el.innerHTML=`<div style="font-weight:600;margin-bottom:8px">${escapeHtml(p.question||'')}</div>`+
    opts.map((o,i)=>{
      const c=results[i]||0, pct=total?Math.round(c*100/total):0, mine=i===myVote;
      if(voted||!USER){
        return `<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>${escapeHtml(String(o))} ${mine?'✓':''}</span><span class="muted">${pct}% (${c})</span></div><div style="height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${pct}%;background:var(--brand)"></div></div></div>`;
      }
      return `<button class="hbtn" style="display:block;width:100%;text-align:left;margin:5px 0" data-poll="${p.id}" data-opt="${i}">${escapeHtml(String(o))}</button>`;
    }).join('') + (!USER?'<div class="muted" style="font-size:.8rem;margin-top:6px">Влез, за да гласуваш.</div>':'');
  wrap.appendChild(el);
  el.querySelectorAll('[data-poll]').forEach(b=>b.onclick=async()=>{try{await sb.rpc('vote_poll',{p_poll_id:b.dataset.poll,p_option_index:+b.dataset.opt});toast('Благодарим за гласа!');newsModal();}catch(e){toast('Грешка при гласуване');}});
}
